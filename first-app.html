<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oslo</title>
<script>
  // Theme: ?theme=light|dark in the URL, else the saved toggle, else the system setting
  (() => {
    const param = new URLSearchParams(location.search).get("theme");
    let saved = null;
    try { saved = localStorage.getItem("oslo-screen-theme"); } catch {}
    const theme = ["light", "dark"].includes(param) ? param
      : ["light", "dark"].includes(saved) ? saved
      : matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
    document.documentElement.dataset.theme = theme;
  })();
</script>
<style>
  /*
   * Material 3. Colour roles are the tonal-spot scheme for seed #3b6ea8
   * (material-color-utilities, standard contrast); the text roles use the
   * medium-contrast values because the panel is small and read from a distance.
   *
   * Sized for the AKP846 panel: 1920 px across only 24 cm (about 8 px per mm),
   * showing all 480 rows Hyprland drives it at. Nothing below ~18 px, and fixed
   * columns measured against the longest realistic values in Roboto and Inter,
   * so no value can push its neighbours around.
   */
  :root {
    color-scheme: dark;
    --md-surface: #111418;
    --md-surface-container: #1d2024;
    --md-surface-container-high: #272a2f;
    --md-on-surface: #f1f2f8;
    --md-on-surface-variant: #d9dce5;
    --md-outline-variant: #43474e;
    --md-primary: #a3c9fe;
    --md-primary-container: #1e4875;
    --md-on-primary-container: #d3e4ff;
    --md-secondary-container: #3c4758;
    --md-on-secondary-container: #d7e3f8;
    --icon-sun: #f2b33d;
    --icon-moon: #e6e3d6;
    --icon-cloud: #c3c6cf;
    --icon-rain: #7fb2f0;
    --icon-snow: #eef0f6;
    /* status colours are the same in both themes; always paired with a text label */
    --status-good: #0ca30c;
    --status-serious: #ec835a;
    --status-critical: #d03b3b;
    --glow: 140 140 150;
    --glow-alpha: 0.10;
    --glow-scale: 1;
    /* 1u = 1% of the 1920x440 base layout (4.4 px at 1920 wide); shrinks to fit narrower windows */
    --u: min(1vh, 0.2291667vw);
    font-family: Roboto, "Inter Variable", Inter, system-ui, sans-serif;
    /* Inter's open digits, if Inter is the font in use */
    font-feature-settings: "ss01" 1;
  }

  :root[data-theme="light"] {
    color-scheme: light;
    --md-surface: #f8f9ff;
    --md-surface-container: #ecedf4;
    --md-surface-container-high: #e1e2e8;
    --md-on-surface: #0e1116;
    --md-on-surface-variant: #32363d;
    --md-outline-variant: #c3c6cf;
    --md-primary: #39608f;
    --md-primary-container: #d3e4ff;
    --md-on-primary-container: #12375f;
    --md-secondary-container: #d7e3f8;
    --md-on-secondary-container: #2d3848;
    --icon-sun: #c77f00;
    --icon-moon: #43474e;
    --icon-cloud: #43474e;
    --icon-rain: #39608f;
    --icon-snow: #5598e7;
    --glow-scale: 0.7;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: var(--md-surface);
    color: var(--md-on-surface);
    transition: background-color 0.4s, color 0.4s;
  }

  body {
    display: grid;
    /* Top-anchored: Zen's fullscreen window is 15 px taller than the 480-row
       screen, so anything centred would hang off the bottom edge */
    place-items: start center;
    /* A dashboard never scrolls or zooms; without gestures a jittery tap can't become a cancelled pan */
    touch-action: none;
    user-select: none;
  }

  body.idle { cursor: none; }

  .stage {
    width: calc(var(--u) * 436.3636);
    /* 440 rows at least, up to the panel's full 480 when the window has them */
    height: clamp(calc(var(--u) * 100), 100vh, calc(var(--u) * 109.1));
    padding: calc(var(--u) * 3.6);
    display: grid;
    grid-template-columns: calc(var(--u) * 111) calc(var(--u) * 139) minmax(0, 1fr) calc(var(--u) * 23.6);
    gap: calc(var(--u) * 2.7);
  }

  /*
   * Every card uses the same four rows, so the big numbers, the titles above
   * them and the details below share baselines across all three cards:
   *   title (7u) / big number (30u, one size everywhere) / detail (6u) / extra
   */
  .card {
    min-width: 0;
    padding: calc(var(--u) * 4) calc(var(--u) * 5.5);
    border-radius: calc(var(--u) * 6.4);
    background: var(--md-surface-container);
    display: grid;
    grid-template-rows: calc(var(--u) * 9) calc(var(--u) * 30) calc(var(--u) * 7.5) calc(var(--u) * 8);
    row-gap: calc(var(--u) * 2.4);
    align-content: center;
    transition: background-color 0.4s;
  }

  .head {
    grid-column: 1 / -1;
    grid-row: 1;
    min-width: 0;
    display: flex;
    align-items: center;
    gap: calc(var(--u) * 2.4);
    font-size: calc(var(--u) * 7);
    line-height: calc(var(--u) * 9);
    font-weight: 500;
    white-space: nowrap;
  }

  .hero {
    grid-column: 1;
    grid-row: 2;
    min-width: 0;
    font-size: calc(var(--u) * 30);
    line-height: calc(var(--u) * 30);
    font-weight: 400;
    letter-spacing: -0.01em;
    white-space: nowrap;
  }

  .detail {
    grid-column: 1;
    grid-row: 3;
    min-width: 0;
    font-size: calc(var(--u) * 6);
    line-height: calc(var(--u) * 7.5);
    color: var(--md-on-surface-variant);
    white-space: nowrap;
  }

  /* ---------- Clock ---------- */
  .clock .hero {
    display: flex;
    align-items: flex-start;
    font-variant-numeric: tabular-nums;
  }

  .clock .hm { margin-left: -0.04em; }

  /* Small seconds, cap-aligned with the top of the big digits */
  .clock .sec {
    margin: calc(var(--u) * 2.7) 0 0 calc(var(--u) * 2);
    font-size: calc(var(--u) * 9);
    line-height: 1;
    font-weight: 500;
    letter-spacing: 0;
    color: var(--md-on-surface-variant);
  }

  /* ---------- Weather ---------- */
  .weather {
    grid-template-columns: calc(var(--u) * 86) calc(var(--u) * 38);
    column-gap: calc(var(--u) * 4);
    background:
      radial-gradient(90% 110% at 0% 0%, rgb(var(--glow) / calc(var(--glow-alpha) * var(--glow-scale) * 1.6)), transparent 70%),
      var(--md-surface-container);
  }

  .weather .head { grid-column: 1; }

  .weather .hero {
    display: flex;
    align-items: center;
    gap: calc(var(--u) * 2.5);
  }

  .weather .wx {
    flex: none;
    width: calc(var(--u) * 20);
    height: calc(var(--u) * 20);
  }

  .stats {
    grid-column: 2;
    grid-row: 1 / span 3;
    align-self: center;
    margin: 0;
    padding: 0;
    list-style: none;
    display: grid;
    gap: calc(var(--u) * 4.5);
  }

  .stats li {
    display: flex;
    align-items: center;
    gap: calc(var(--u) * 2);
    font-size: calc(var(--u) * 6);
    font-weight: 500;
    white-space: nowrap;
  }

  .stats svg {
    flex: none;
    width: calc(var(--u) * 5.5);
    height: calc(var(--u) * 5.5);
    color: var(--md-on-surface-variant);
  }

  #wind-arrow { transition: transform 0.6s; }

  .unit {
    font-size: 0.8em;
    font-weight: 400;
    color: var(--md-on-surface-variant);
  }

  /* ---------- Departures (the emphasised, primary-container card) ---------- */
  .transit {
    --on: var(--md-on-primary-container);
    --on-variant: color-mix(in srgb, var(--md-on-primary-container) 80%, var(--md-primary-container));
    --line: color-mix(in srgb, var(--md-on-primary-container) 22%, var(--md-primary-container));
    grid-template-columns: calc(var(--u) * 64) minmax(0, 1fr);
    column-gap: calc(var(--u) * 5);
    background: var(--md-primary-container);
    color: var(--on);
  }

  .line-badge {
    flex: none;
    min-width: calc(var(--u) * 8);
    height: calc(var(--u) * 8);
    padding: 0 calc(var(--u) * 1.6);
    border-radius: calc(var(--u) * 2);
    display: grid;
    place-items: center;
    font-size: calc(var(--u) * 5.2);
    line-height: 1;
    font-weight: 700;
    background: #ec700c;
    color: #ffffff;
  }

  /* A clock time instead of minutes when the next departure is an hour or more away */
  .countdown.far { font-size: calc(var(--u) * 18); font-variant-numeric: tabular-nums; }

  .countdown small {
    margin-left: calc(var(--u) * 1.6);
    font-size: calc(var(--u) * 8.5);
    font-weight: 500;
    letter-spacing: 0;
    color: var(--on-variant);
  }

  .transit .detail {
    font-weight: 500;
    color: var(--on-variant);
    font-variant-numeric: tabular-nums;
  }

  .chip-row {
    grid-column: 1;
    grid-row: 4;
    align-self: start;
  }

  /* All departures cancelled: no countdown or list, so the reason gets the full width */
  .transit.disrupted .detail,
  .transit.disrupted .chip-row { grid-column: 1 / -1; }
  .transit.disrupted .detail { overflow: hidden; text-overflow: ellipsis; }

  /* Status as a Material assist chip */
  .chip {
    display: inline-flex;
    align-items: center;
    gap: calc(var(--u) * 1.5);
    padding: calc(var(--u) * 0.9) calc(var(--u) * 2.4);
    border-radius: 999px;
    background: color-mix(in srgb, var(--on) 12%, var(--md-primary-container));
    font-size: calc(var(--u) * 5);
    font-weight: 500;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  .chip:empty { display: none; }

  .dot {
    flex: none;
    width: calc(var(--u) * 2.4);
    height: calc(var(--u) * 2.4);
    border-radius: 50%;
  }

  .dot.good { background: var(--status-good); }
  .dot.serious { background: var(--status-serious); }
  .dot.critical { background: var(--status-critical); }

  .later {
    grid-column: 2;
    grid-row: 2 / span 3;
    align-self: start;
    min-width: 0;
  }

  .later ol {
    list-style: none;
    margin: 0;
    padding: 0;
  }

  .later li {
    display: grid;
    grid-template-columns: calc(var(--u) * 24) minmax(0, 1fr);
    align-items: baseline;
    column-gap: calc(var(--u) * 3.5);
    padding: calc(var(--u) * 2.4) 0;
    border-top: 1px solid var(--line);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  .later li:first-child { border-top: 0; padding-top: 0; }
  .later .dep { font-size: calc(var(--u) * 8); font-weight: 500; }
  .later .in { display: flex; align-items: center; gap: calc(var(--u) * 1.4); font-size: calc(var(--u) * 6.5); color: var(--on-variant); }
  .later li.cancelled .dep { color: var(--on-variant); text-decoration: line-through; }

  /* ---------- Control rail ---------- */
  /* Concentric corners: rail radius = button radius (5u) + the even padding around the buttons (2.3u) */
  .rail {
    align-self: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: calc(var(--u) * 2.7);
    padding: calc(var(--u) * 2.3);
    border-radius: calc(var(--u) * 7.3);
    background: var(--md-surface-container);
    transition: background-color 0.4s;
  }

  /* Filled tonal buttons: 84 x ~78 px, about 10 mm on this panel, with a larger tap area */
  .rail-btn {
    position: relative;
    width: calc(var(--u) * 19);
    padding: calc(var(--u) * 2.6) 0 calc(var(--u) * 2.2);
    border: 0;
    border-radius: calc(var(--u) * 5);
    background: var(--md-secondary-container);
    color: var(--md-on-secondary-container);
    font: inherit;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: calc(var(--u) * 0.8);
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: border-radius 0.15s, transform 0.1s, background-color 0.2s;
  }

  .rail-btn::after {
    content: "";
    position: absolute;
    inset: calc(var(--u) * -1.3);
  }

  /* Pressed: Material state layer, plus the expressive shape change */
  .rail-btn:active {
    background: color-mix(in srgb, var(--md-on-secondary-container) 12%, var(--md-secondary-container));
    border-radius: calc(var(--u) * 3.4);
    transform: scale(0.96);
  }

  .rail-btn:focus-visible {
    outline: 2px solid var(--md-primary);
    outline-offset: 2px;
  }

  /* Hover only for a real mouse, so a tap doesn't leave the button highlighted */
  @media (hover: hover) {
    .rail-btn:hover { background: color-mix(in srgb, var(--md-on-secondary-container) 8%, var(--md-secondary-container)); }
  }

  .rail-icon {
    width: calc(var(--u) * 7.2);
    height: calc(var(--u) * 7.2);
  }

  .rail-label {
    font-size: calc(var(--u) * 4.6);
    font-weight: 500;
    white-space: nowrap;
  }

  #theme-toggle .to-dark,
  :root[data-theme="light"] #theme-toggle .to-light { display: none; }
  :root[data-theme="light"] #theme-toggle .to-dark { display: block; }

  /* ---------- ?debug: input event log ---------- */
  .debug-log {
    position: fixed;
    left: 8px;
    top: 8px;
    z-index: 10;
    margin: 0;
    padding: 6px 10px;
    border-radius: 6px;
    background: rgba(0, 0, 0, 0.8);
    color: #7cfc00;
    font: 600 16px/1.35 ui-monospace, monospace;
    white-space: pre;
    pointer-events: none;
  }

  .debug-dot {
    position: fixed;
    z-index: 11;
    width: 30px;
    height: 30px;
    margin: -15px 0 0 -15px;
    border-radius: 50%;
    background: rgba(255, 40, 40, 0.65);
    pointer-events: none;
  }

  /* ---------- Weather icons ---------- */
  .i-sun { fill: none; stroke: var(--icon-sun); }
  .i-moon { fill: none; stroke: var(--icon-moon); }
  .i-cloud { fill: var(--md-surface-container); stroke: var(--icon-cloud); }
  .i-drop { fill: none; stroke: var(--icon-rain); }
  .i-flake { fill: var(--icon-snow); stroke: none; }
  .i-fog { fill: none; stroke: var(--icon-cloud); }
  .i-bolt { fill: none; stroke: var(--icon-sun); }
  symbol[id^="wx-"] * { stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="wx-sun-shape" viewBox="0 0 64 64">
      <g class="i-sun">
        <circle cx="32" cy="32" r="10"/>
        <path d="M32 10v6M32 48v6M10 32h6M48 32h6M16.4 16.4l4.3 4.3M43.3 43.3l4.3 4.3M16.4 47.6l4.3-4.3M43.3 20.7l4.3-4.3"/>
      </g>
    </symbol>
    <symbol id="wx-moon-shape" viewBox="0 0 64 64">
      <path class="i-moon" d="M41 13a20 20 0 1 0 12 28A16 16 0 0 1 41 13z"/>
    </symbol>
    <symbol id="wx-cloud-shape" viewBox="0 0 64 64">
      <path class="i-cloud" d="M22 46H46a9 9 0 0 0 1-18a13 13 0 0 0-25-2a10 10 0 0 0 0 20z"/>
    </symbol>

    <symbol id="wx-clear-day" viewBox="0 0 64 64"><use href="#wx-sun-shape"/></symbol>
    <symbol id="wx-clear-night" viewBox="0 0 64 64"><use href="#wx-moon-shape"/></symbol>
    <symbol id="wx-partly-day" viewBox="0 0 64 64">
      <use href="#wx-sun-shape" x="-9" y="-9" width="52" height="52"/>
      <use href="#wx-cloud-shape" x="4" y="6"/>
    </symbol>
    <symbol id="wx-partly-night" viewBox="0 0 64 64">
      <use href="#wx-moon-shape" x="-7" y="-8" width="50" height="50"/>
      <use href="#wx-cloud-shape" x="4" y="6"/>
    </symbol>
    <symbol id="wx-cloudy" viewBox="0 0 64 64"><use href="#wx-cloud-shape" y="2"/></symbol>
    <symbol id="wx-fog" viewBox="0 0 64 64">
      <use href="#wx-cloud-shape" y="-8"/>
      <path class="i-fog" d="M16 48h32M21 55h22"/>
    </symbol>
    <symbol id="wx-drizzle" viewBox="0 0 64 64">
      <use href="#wx-cloud-shape" y="-8"/>
      <path class="i-drop" d="M24 46l-1.5 3M34 46l-1.5 3M44 46l-1.5 3M29 53l-1.5 3M39 53l-1.5 3"/>
    </symbol>
    <symbol id="wx-rain" viewBox="0 0 64 64">
      <use href="#wx-cloud-shape" y="-8"/>
      <path class="i-drop" d="M25 45l-4 10M35 45l-4 10M45 45l-4 10"/>
    </symbol>
    <symbol id="wx-snow" viewBox="0 0 64 64">
      <use href="#wx-cloud-shape" y="-8"/>
      <g class="i-flake">
        <circle cx="23" cy="48" r="2.2"/><circle cx="33" cy="48" r="2.2"/><circle cx="43" cy="48" r="2.2"/>
        <circle cx="28" cy="56" r="2.2"/><circle cx="38" cy="56" r="2.2"/>
      </g>
    </symbol>
    <symbol id="wx-thunder" viewBox="0 0 64 64">
      <use href="#wx-cloud-shape" y="-8"/>
      <path class="i-bolt" d="M35 41l-6 9h7l-5 9"/>
    </symbol>

    <!-- Small icons, drawn in the current text colour -->
    <symbol id="i-sunrise" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M17 18a5 5 0 0 0-10 0M12 9V2M8 6l4-4 4 4M4.2 10.2l1.4 1.4M1 18h2M21 18h2M18.4 11.6l1.4-1.4M23 22H1"/>
      </g>
    </symbol>
    <symbol id="i-sunset" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M17 18a5 5 0 0 0-10 0M12 2v7M16 5l-4 4-4-4M4.2 10.2l1.4 1.4M1 18h2M21 18h2M18.4 11.6l1.4-1.4M23 22H1"/>
      </g>
    </symbol>
    <symbol id="i-train" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="5" y="2.5" width="14" height="14.5" rx="3.5"/>
        <path d="M5 10h14M8.5 17l-2.5 4.5M15.5 17l2.5 4.5"/>
        <circle cx="8.8" cy="13.5" r="0.4"/><circle cx="15.2" cy="13.5" r="0.4"/>
      </g>
    </symbol>
    <symbol id="i-bus" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4" y="2.5" width="16" height="15" rx="2.5"/>
        <path d="M4 10h16M7.5 17.5v3M16.5 17.5v3"/>
        <circle cx="8" cy="13.8" r="0.4"/><circle cx="16" cy="13.8" r="0.4"/>
      </g>
    </symbol>
  </defs>
</svg>

<main class="stage" id="stage">
  <section class="card clock" aria-label="Time in Oslo">
    <div class="head"><span id="date"></span></div>
    <div class="hero"><span class="hm" id="hm">--:--</span><span class="sec" id="sec">--</span></div>
    <div class="detail" id="week"></div>
  </section>

  <section class="card weather" aria-label="Weather in Oslo">
    <div class="head"><span id="now-cond">Loading weather&hellip;</span></div>
    <div class="hero">
      <svg class="wx" aria-hidden="true"><use id="now-icon" href="#wx-cloudy"/></svg>
      <span id="now-temp">--&deg;</span>
    </div>
    <div class="detail" id="now-feels">&nbsp;</div>
    <ul class="stats">
      <li title="Wind">
        <svg id="wind-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20V4M5 11l7-7 7 7"/></svg>
        <span id="wind">&ndash;</span>
      </li>
      <li title="Today's high / low">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 14.8V4.5a2.5 2.5 0 0 0-5 0v10.3a4.5 4.5 0 1 0 5 0z"/></svg>
        <span id="hilo">&ndash;</span>
      </li>
      <li title="Next sunrise or sunset">
        <svg aria-hidden="true"><use id="sun-icon" href="#i-sunset"/></svg>
        <span id="sun">&ndash;</span>
      </li>
    </ul>
  </section>

  <section class="card transit" id="transit-card" aria-label="Next departures">
    <div class="head">
      <span class="line-badge" id="line-badge">5</span>
      <span id="route-name">Sognsvann &rarr; T&aring;sen</span>
    </div>
    <div class="hero countdown" id="next-countdown" hidden></div>
    <div class="detail" id="next-meta">Loading departures&hellip;</div>
    <div class="chip-row"><span class="chip" id="next-flag"></span></div>
    <div class="later" id="later-block">
      <ol id="later"></ol>
    </div>
  </section>

  <nav class="rail" aria-label="Display controls">
    <button class="rail-btn" id="theme-toggle" type="button">
      <svg class="rail-icon to-light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="rail-icon to-dark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
      <span class="rail-label" id="theme-label">Light</span>
    </button>
    <button class="rail-btn" id="route-toggle" type="button">
      <svg class="rail-icon" aria-hidden="true"><use id="route-icon" href="#i-bus"/></svg>
      <span class="rail-label" id="route-label">Bus</span>
    </button>
  </nav>
</main>

<script>
(() => {
  const LAT = 59.9133, LON = 10.7389, TZ = "Europe/Oslo";
  const REFRESH_MS = 10 * 60 * 1000, RETRY_MS = 60 * 1000;
  const CACHE_KEY = "oslo-screen-weather";
  const API = "https://api.open-meteo.com/v1/forecast?" + new URLSearchParams({
    latitude: LAT, longitude: LON, timezone: TZ, timeformat: "unixtime",
    wind_speed_unit: "ms", models: "metno_seamless",
    forecast_days: 2,
    current: "temperature_2m,apparent_temperature,weather_code,wind_speed_10m,wind_direction_10m,is_day",
    daily: "temperature_2m_max,temperature_2m_min,sunrise,sunset",
  });

  const $ = (id) => document.getElementById(id);
  const make = (tag, props) => Object.assign(document.createElement(tag), props);
  const params = new URLSearchParams(location.search);
  const store = {
    get: (key) => { try { return localStorage.getItem(key); } catch { return null; } },
    set: (key, value) => { try { localStorage.setItem(key, value); } catch {} },
  };

  const WMO = {
    0: "Clear sky", 1: "Mainly clear", 2: "Partly cloudy", 3: "Overcast",
    45: "Fog", 48: "Freezing fog",
    51: "Light drizzle", 53: "Drizzle", 55: "Heavy drizzle", 56: "Freezing drizzle", 57: "Freezing drizzle",
    61: "Light rain", 63: "Rain", 65: "Heavy rain", 66: "Freezing rain", 67: "Freezing rain",
    71: "Light snow", 73: "Snow", 75: "Heavy snow", 77: "Snow grains",
    80: "Rain showers", 81: "Rain showers", 82: "Heavy showers",
    85: "Snow showers", 86: "Heavy snow showers",
    95: "Thunderstorm", 96: "Thunderstorm, hail", 99: "Thunderstorm, hail",
  };

  // Tint in the weather card, keyed by sky type: [r g b, alpha]
  const GLOW = {
    "clear-day": ["242 179 61", 0.16], "clear-night": ["90 100 190", 0.20],
    "partly-day": ["150 170 210", 0.13], "partly-night": ["80 90 160", 0.16],
    cloudy: ["140 140 150", 0.10], fog: ["160 160 165", 0.10],
    drizzle: ["57 135 229", 0.14], rain: ["57 135 229", 0.18],
    snow: ["210 220 240", 0.13], thunder: ["144 133 233", 0.18],
  };

  function sky(code, isDay) {
    if (code <= 1) return isDay ? "clear-day" : "clear-night";
    if (code === 2) return isDay ? "partly-day" : "partly-night";
    if (code === 45 || code === 48) return "fog";
    if (code >= 51 && code <= 57) return "drizzle";
    if ((code >= 61 && code <= 67) || (code >= 80 && code <= 82)) return "rain";
    if ((code >= 71 && code <= 77) || code === 85 || code === 86) return "snow";
    if (code >= 95) return "thunder";
    return "cloudy";
  }

  const fmt = (opts) => new Intl.DateTimeFormat("en-GB", { timeZone: TZ, ...opts });
  const fmtHM = fmt({ hour: "2-digit", minute: "2-digit", hourCycle: "h23" });
  const fmtSec = fmt({ second: "2-digit" });
  const fmtDate = fmt({ weekday: "long", day: "numeric", month: "long" });
  const fmtYMD = fmt({ year: "numeric", month: "numeric", day: "numeric" });

  const deg = (t) => {
    const n = Math.round(t) || 0;
    return `${n < 0 ? "\u2212" : ""}${Math.abs(n)}\u00b0`;
  };
  const hm = (t) => fmtHM.format(new Date(t));

  function isoWeek(date) {
    const [d, m, y] = fmtYMD.format(date).split("/").map(Number);
    const t = new Date(Date.UTC(y, m - 1, d));
    const dow = t.getUTCDay() || 7;
    t.setUTCDate(t.getUTCDate() + 4 - dow);
    const yearStart = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
    return Math.ceil(((t - yearStart) / 86400000 + 1) / 7);
  }

  async function fetchJSON(url, options = {}) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 15000);
    try {
      const res = await fetch(url, { ...options, signal: ctrl.signal, cache: "no-store" });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      return await res.json();
    } finally {
      clearTimeout(timer);
    }
  }

  // Touch: act as soon as the finger lifts off a control rather than waiting for the
  // browser to turn the tap into a click, which it doesn't always do for this panel.
  // Mouse and keyboard use click; the click a browser may still synthesize from the
  // same tap is skipped.
  function onTap(el, handler) {
    let lastTouch = 0;
    el.addEventListener("pointerup", (ev) => {
      if (ev.pointerType === "mouse") return;
      lastTouch = Date.now();
      handler();
    });
    el.addEventListener("click", () => {
      if (Date.now() - lastTouch < 800) return;
      handler();
    });
    // Quick taps on a control shouldn't also toggle fullscreen
    el.addEventListener("dblclick", (ev) => ev.stopPropagation());
  }

  // ---------- Clock ----------
  function tick() {
    const now = new Date();
    $("hm").textContent = fmtHM.format(now);
    $("sec").textContent = fmtSec.format(now).padStart(2, "0");
    $("date").textContent = fmtDate.format(now).replace(",", "");
    $("week").textContent = `Week ${isoWeek(now)}`;
    setTimeout(tick, 1000 - (Date.now() % 1000) + 5);
  }
  tick();

  // ---------- Weather ----------
  let weather = null;
  let lastOk = 0;

  function compass(degrees) {
    return ["N", "NE", "E", "SE", "S", "SW", "W", "NW"][Math.round(degrees / 45) % 8];
  }

  function renderWeather() {
    if (!weather) return;
    const c = weather.current, d = weather.daily, now = Date.now();
    const kind = sky(c.weather_code, c.is_day);
    $("now-icon").setAttribute("href", `#wx-${kind}`);
    $("now-temp").textContent = deg(c.temperature_2m);
    $("now-cond").textContent = WMO[c.weather_code] ?? "\u2014";
    const stale = now - lastOk > 30 * 60 * 1000;
    $("now-feels").textContent = `Feels like ${deg(c.apparent_temperature)}${stale ? " \u00b7 offline" : ""}`;

    $("wind").replaceChildren(`${Math.round(c.wind_speed_10m)} `, make("span", { className: "unit", textContent: "m/s" }), ` ${compass(c.wind_direction_10m)}`);
    // Arrow points where the wind is blowing to
    $("wind-arrow").style.transform = `rotate(${(c.wind_direction_10m + 180) % 360}deg)`;
    // No spaces around the slash: keeps "-10deg/-15deg" inside its column
    $("hilo").replaceChildren(deg(d.temperature_2m_max[0]), make("span", { className: "unit", textContent: "/" }), deg(d.temperature_2m_min[0]));

    // Only the next sun event: today's sunrise, today's sunset, or tomorrow's sunrise
    const events = [["sunrise", d.sunrise[0]], ["sunset", d.sunset[0]], ["sunrise", d.sunrise[1]]];
    const [kindOfSun, at] = events.find(([, s]) => s && s * 1000 > now) ?? events[1];
    $("sun-icon").setAttribute("href", `#i-${kindOfSun}`);
    $("sun").textContent = hm(at * 1000);

    const [rgb, alpha] = GLOW[kind];
    document.documentElement.style.setProperty("--glow", rgb);
    document.documentElement.style.setProperty("--glow-alpha", alpha);
  }

  async function refreshWeather() {
    let next = REFRESH_MS;
    try {
      weather = await fetchJSON(API);
      lastOk = Date.now();
      store.set(CACHE_KEY, JSON.stringify({ weather, lastOk }));
    } catch (err) {
      console.warn("Weather refresh failed:", err);
      next = RETRY_MS;
    }
    renderWeather();
    setTimeout(refreshWeather, next);
  }

  try {
    const cached = JSON.parse(store.get(CACHE_KEY) || "null");
    if (cached && Date.now() - cached.lastOk < 6 * 3600 * 1000) ({ weather, lastOk } = cached);
  } catch {}
  renderWeather();
  refreshWeather();
  // Moves the sun event along and flags stale data between fetches
  setInterval(renderWeather, 60 * 1000);

  // ---------- Departures (Ruter realtime data via Entur) ----------
  // `from` is a whole stop place or one platform (quay); departures are kept only
  // if the vehicle calls at `dest` after leaving.
  const ROUTES = {
    tbane: {
      label: "T-bane", icon: "#i-train", line: "5", colour: "EC700C",
      name: "Sognsvann \u2192 T\u00e5sen",
      from: { kind: "stopPlace", id: "NSR:StopPlace:59705" }, // Sognsvann
      dest: "NSR:StopPlace:59573", // Tasen
      modes: ["metro"],
    },
    bus: {
      label: "Bus", icon: "#i-bus", line: "34", colour: "E60000",
      name: "T\u00e5sen \u2192 Sagene",
      from: { kind: "quay", id: "NSR:Quay:11345" }, // Tasen senter, platform A (bus 34 towards Sagene)
      dest: "NSR:StopPlace:59894", // Sagene
      modes: ["bus"],
    },
  };
  const ENTUR = "https://api.entur.io/journey-planner/v3/graphql";
  const TRANSIT_REFRESH_MS = 30 * 1000;
  // Room for a long run of cancellations (a closed station cancels every call) without losing the trains that do run
  const CALLS = `estimatedCalls(numberOfDepartures: 20, timeRange: 21600, whiteListedModes: $modes,
                                arrivalDeparture: departures, includeCancelledTrips: true) {
      aimedDepartureTime expectedDepartureTime realtime cancellation
      quay { id }
      situations { summary { value language } }
      serviceJourney {
        line { publicCode presentation { colour textColour } }
        estimatedCalls { quay { id stopPlace { id parent { id } } } aimedDepartureTime expectedArrivalTime }
      }
    }`;
  const queryFor = (kind) => `query ($id: String!, $modes: [TransportMode]) { place: ${kind}(id: $id) { ${CALLS} } }`;

  let routeKey = ROUTES[params.get("route")] ? params.get("route") : ROUTES[store.get("oslo-screen-route")] ? store.get("oslo-screen-route") : "tbane";
  let departures = [];
  let transitOk = 0;
  let transitTimer = 0;
  const transitCacheKey = () => `oslo-screen-transit-${routeKey}`;

  function parseDepartures(calls, route) {
    return calls.flatMap((c) => {
      const journey = c.serviceJourney.estimatedCalls;
      // Only stops after this departure count: a line can pass the destination earlier on its way
      const here = journey.findIndex((s) => s.quay?.id === c.quay?.id && s.aimedDepartureTime === c.aimedDepartureTime);
      const stop = journey.slice(here + 1).find(({ quay }) =>
        quay?.stopPlace && (quay.stopPlace.id === route.dest || quay.stopPlace.parent?.id === route.dest));
      if (!stop) return [];
      // The disruption message, e.g. "Sognsvann station is closed", in English when Entur has it
      const summary = c.situations?.[0]?.summary ?? [];
      const notice = (summary.find((s) => s.language === "en") ?? summary[0])?.value;
      return [{
        dep: Date.parse(c.expectedDepartureTime),
        aimed: Date.parse(c.aimedDepartureTime),
        arr: Date.parse(stop.expectedArrivalTime),
        realtime: c.realtime,
        cancelled: c.cancellation,
        notice,
        line: c.serviceJourney.line.publicCode,
        colour: c.serviceJourney.line.presentation?.colour,
        textColour: c.serviceJourney.line.presentation?.textColour,
      }];
    });
  }

  const minutesUntil = (t) => Math.floor((t - Date.now()) / 60000);

  function flag(dotClass, label) {
    const dot = dotClass ? [make("i", { className: `dot ${dotClass}` })] : [];
    $("next-flag").replaceChildren(...dot, label);
  }

  function renderTransit() {
    const route = ROUTES[routeKey];
    const now = Date.now();
    const upcoming = departures.filter((d) => d.dep > now - 20 * 1000);
    const next = upcoming.find((d) => !d.cancelled);
    const skipped = next ? upcoming.filter((d) => d.cancelled && d.dep < next.dep) : [];
    const later = next ? upcoming.filter((d) => d.dep > next.dep).slice(0, 3) : [];

    $("route-name").textContent = route.name;
    const first = next ?? upcoming[0];
    const badge = $("line-badge");
    const colour = first?.colour ?? route.colour, textColour = first?.textColour ?? "FFFFFF";
    badge.textContent = first?.line ?? route.line;
    if (/^[0-9a-f]{6}$/i.test(colour)) badge.style.background = `#${colour}`;
    if (/^[0-9a-f]{6}$/i.test(textColour)) badge.style.color = `#${textColour}`;

    const offline = transitOk && now - transitOk > 3 * 60 * 1000;
    // Every departure cancelled: say so, and why, across the whole card
    const allCancelled = !next && upcoming.length > 0;
    $("transit-card").classList.toggle("disrupted", allCancelled);
    $("next-countdown").hidden = !next;
    $("later-block").hidden = !later.length;
    if (!next) {
      $("next-meta").textContent = allCancelled ? upcoming.find((d) => d.notice)?.notice ?? "No departures running"
        : transitOk ? "Nothing in the next 6 hours" : "Loading departures\u2026";
      if (offline) flag("serious", `Offline since ${hm(transitOk)}`);
      else if (allCancelled) flag("critical", "All departures cancelled");
      else $("next-flag").replaceChildren();
    } else {
      const m = minutesUntil(next.dep);
      const countdown = $("next-countdown");
      countdown.classList.toggle("far", m >= 60);
      if (m < 1) countdown.replaceChildren("Now");
      else if (m < 60) countdown.replaceChildren(String(m), make("small", { textContent: "min" }));
      else countdown.replaceChildren(hm(next.dep));
      // The header already names both stops, so departure -> arrival needs no labels
      $("next-meta").textContent = `${hm(next.dep)} \u2192 ${hm(next.arr)}`;

      const delay = Math.round((next.dep - next.aimed) / 60000);
      if (offline) flag("serious", `Offline since ${hm(transitOk)}`);
      else if (skipped.length > 2) flag("critical", `${skipped.length} earlier cancelled`);
      else if (skipped.length) flag("critical", `${skipped.map((d) => hm(d.aimed)).join(", ")} cancelled`);
      else if (delay >= 2) flag("serious", `${delay} min late`);
      else if (next.realtime) flag("good", "Live");
      else flag("", "Scheduled");
    }

    $("later").replaceChildren(...later.map((d) => {
      const m = minutesUntil(d.dep);
      const until = m < 60 ? `${Math.max(m, 0)} min` : `${Math.floor(m / 60)} h ${m % 60} min`;
      const inCell = make("span", { className: "in", textContent: d.cancelled ? "Cancelled" : until });
      if (d.cancelled) inCell.prepend(make("i", { className: "dot critical" }));
      const li = make("li", { className: d.cancelled ? "cancelled" : "" });
      li.append(make("span", { className: "dep", textContent: hm(d.dep) }), inCell);
      return li;
    }));
  }

  async function refreshTransit() {
    clearTimeout(transitTimer);
    const key = routeKey, route = ROUTES[key];
    let next = TRANSIT_REFRESH_MS;
    try {
      const json = await fetchJSON(ENTUR, {
        method: "POST",
        headers: { "Content-Type": "application/json", "ET-Client-Name": "eddy-oslo-screen" },
        body: JSON.stringify({ query: queryFor(route.from.kind), variables: { id: route.from.id, modes: route.modes } }),
      });
      if (json.errors?.length) throw new Error(json.errors[0].message);
      if (key !== routeKey) return; // switched route while this was in flight
      departures = parseDepartures(json.data.place.estimatedCalls, route);
      transitOk = Date.now();
      store.set(transitCacheKey(), JSON.stringify({ departures, transitOk }));
    } catch (err) {
      if (key !== routeKey) return;
      console.warn("Departures refresh failed:", err);
      next = RETRY_MS;
    }
    renderTransit();
    transitTimer = setTimeout(refreshTransit, next);
  }

  function loadRoute() {
    departures = [];
    transitOk = 0;
    try {
      const cached = JSON.parse(store.get(transitCacheKey()) || "null");
      if (cached) ({ departures, transitOk } = cached);
    } catch {}
    const other = ROUTES[routeKey === "tbane" ? "bus" : "tbane"];
    $("route-icon").setAttribute("href", other.icon);
    $("route-label").textContent = other.label;
    $("route-toggle").setAttribute("aria-label", `Show ${other.label} departures`);
    renderTransit();
    refreshTransit();
  }

  loadRoute();
  // Countdowns tick between fetches
  setInterval(renderTransit, 5 * 1000);

  onTap($("route-toggle"), () => {
    routeKey = routeKey === "tbane" ? "bus" : "tbane";
    store.set("oslo-screen-route", routeKey);
    loadRoute();
  });

  // ---------- Light / dark (the initial theme is set in <head>) ----------
  const labelTheme = () => {
    const next = document.documentElement.dataset.theme === "light" ? "dark" : "light";
    $("theme-label").textContent = next === "light" ? "Light" : "Dark";
    $("theme-toggle").setAttribute("aria-label", `Switch to ${next} mode`);
  };
  labelTheme();
  onTap($("theme-toggle"), () => {
    const theme = document.documentElement.dataset.theme === "light" ? "dark" : "light";
    document.documentElement.dataset.theme = theme;
    store.set("oslo-screen-theme", theme);
    labelTheme();
  });

  // ---------- Screen behaviour ----------
  // Hide the cursor when idle; double-click / double-tap toggles fullscreen
  let idleTimer = 0;
  addEventListener("pointermove", () => {
    document.body.classList.remove("idle");
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => document.body.classList.add("idle"), 3000);
  });
  addEventListener("dblclick", () => {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen?.().catch(() => {});
  });

  // ?debug: log touch / pointer / click events, to check that taps reach the page
  if (params.has("debug")) {
    const log = make("pre", { className: "debug-log", textContent: "debug: waiting for input\u2026" });
    document.body.append(log);
    const lines = [];
    const note = (ev) => {
      const point = ev.touches?.[0] ?? ev.changedTouches?.[0] ?? ev;
      const x = Math.round(point.clientX), y = Math.round(point.clientY);
      const t = ev.target;
      const name = t.id || t.getAttribute?.("class") || t.tagName;
      lines.unshift(`${new Date().toLocaleTimeString("en-GB")}  ${ev.type}${ev.pointerType ? ` (${ev.pointerType})` : ""}  ${x},${y}  on ${name}`);
      lines.length = Math.min(lines.length, 8);
      log.textContent = `debug: ${innerWidth}x${innerHeight}\n${lines.join("\n")}`;
      if (ev.type === "pointerdown" || ev.type === "touchstart") {
        const dot = make("i", { className: "debug-dot" });
        dot.style.left = `${x}px`;
        dot.style.top = `${y}px`;
        document.body.append(dot);
        setTimeout(() => dot.remove(), 1000);
      }
    };
    for (const type of ["touchstart", "touchend", "touchcancel", "pointerdown", "pointerup", "pointercancel", "click"]) {
      addEventListener(type, note, { capture: true, passive: true });
    }
  }
})();
</script>
</body>
</html>
